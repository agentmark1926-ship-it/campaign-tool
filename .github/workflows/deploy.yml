name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  WEB_PROJECT: src/CampaignTool.Web/CampaignTool.Web.csproj

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # Database tests need a SQL Server; a throwaway container with a per-run password.
      - name: Start SQL Server for tests
        run: |
          pw="Ci$(openssl rand -hex 12)!Aa"
          echo "::add-mask::$pw"
          docker run -d --name sql -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$pw" -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          echo "CAMPAIGNTOOL_TEST_SQL=Server=localhost,1433;User ID=sa;Password=$pw;TrustServerCertificate=True" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if docker logs sql 2>&1 | grep -q "ready for client connections"; then exit 0; fi
            sleep 2
          done
          docker logs sql; exit 1

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Publish
        run: dotnet publish ${{ env.WEB_PROJECT }} --configuration Release --no-build --output ${{ github.workspace }}/publish

      # OIDC login: an app registration with a federated credential for this repo/branch.
      # Repository secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID.
      # Repository variable: AZURE_WEBAPP_NAME (the Web App name from the Bicep output).
      # Simpler alternative for a solo project: skip azure/login and pass
      # `publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}` to azure/webapps-deploy instead.
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ${{ github.workspace }}/publish

      - name: Health check
        run: |
          url="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/health"
          for i in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
            if [ "$code" = "200" ]; then echo "healthy"; exit 0; fi
            echo "attempt $i: $code"; sleep 10
          done
          echo "health check failed"; exit 1
